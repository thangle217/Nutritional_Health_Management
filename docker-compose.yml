services:
  postgres:
    image: postgres:17-alpine
    container_name: nhom12-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nhom12_dev
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - nhom12_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d nhom12_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nhom12-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nhom12.local
      PGADMIN_DEFAULT_PASSWORD: change_me
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nhom12_pgdata:
